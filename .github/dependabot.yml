version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot moves the SHA and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    groups:
      dev-dependencies:
        dependency-type: development
