name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer:
    name: composer validate and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer audit

  tests:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, ${{ matrix.dependencies }} dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12', '13']
        dependencies: ['highest', 'lowest']
        include:
          - laravel: '12'
            illuminate: '^12.69'
            testbench: '^10.0'
          - laravel: '13'
            illuminate: '^13.30'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      - name: Pin Laravel ${{ matrix.laravel }}
        run: |
          composer require --no-update "illuminate/support:${{ matrix.illuminate }}" "illuminate/console:${{ matrix.illuminate }}" "illuminate/contracts:${{ matrix.illuminate }}"
          composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Code style
        run: vendor/bin/pint --test

      - name: Larastan (level max, strict rules, no baseline)
        run: |
          vendor/bin/phpstan clear-result-cache
          vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # --fail-on-skipped and --fail-on-incomplete: a test that did not run is not a pass.
      - name: Tests
        run: vendor/bin/pest --colors=never --fail-on-skipped --fail-on-incomplete
